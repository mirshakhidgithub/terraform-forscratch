---
- name: Install and configure Nginx
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify Nginx responds on port 80
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      register: nginx_http_check
      retries: 5
      delay: 2
      until: nginx_http_check.status == 200
